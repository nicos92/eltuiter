name: eltuiter

services:
  mongo:
    image: mongo:8.3.8
    container_name: mongo_container
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      GLIBC_TUNABLES: ${GLIBC_TUNABLES}
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
